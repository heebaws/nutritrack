<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="nt-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Leaf Diagonal Gradient -->
    <linearGradient id="nt-lime-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Stem Glow Gradient -->
    <linearGradient id="nt-accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="nt-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <filter id="nt-inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle rounded background tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#nt-bg-grad)" filter="url(#nt-shadow)" />

  <!-- Subtle inner border highlight -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Stylized Geometric "N" with Organic Nutrition Leaf Integration -->
  <g id="nt-symbol" filter="url(#nt-inner-shadow)">
    <!-- Left Upright Stem of N: Solid Crisp White -->
    <path 
      d="M 148 132 
         C 148 120 158 110 170 110 
         L 194 110 
         C 206 110 216 120 216 132 
         L 216 380 
         C 216 392 206 402 194 402 
         L 170 402 
         C 158 402 148 392 148 380 
         Z" 
      fill="#ffffff" 
    />

    <!-- Right Upright Stem of N: Solid Crisp White with dynamic growth curve at top -->
    <path 
      d="M 296 132 
         C 296 120 306 110 318 110 
         L 342 110 
         C 354 110 364 120 364 132 
         L 364 380 
         C 364 392 354 402 342 402 
         L 318 402 
         C 306 402 296 392 296 380 
         Z" 
      fill="#ffffff" 
    />

    <!-- Diagonal Spanning Leaf (acting as the cross-diagonal of 'N' & blooming upward) -->
    <!-- Elegantly sweeping from bottom-left upright (180, 360) diagonally upward to right upright and curving out into a fresh botanical leaf -->
    <path 
      d="M 180 340 
         C 180 340, 240 250, 320 180 
         C 350 152, 385 130, 404 96 
         C 408 88, 412 84, 416 80 
         C 416 88, 412 112, 400 134 
         C 382 168, 345 208, 296 264 
         C 252 314, 218 362, 192 384 
         C 184 390, 172 388, 172 376 
         L 172 350 
         Z" 
      fill="url(#nt-lime-grad)" 
    />

    <!-- Leaf Vein & Vitality Arc Accent -->
    <path 
      d="M 216 310 
         C 260 250, 320 180, 402 96" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-opacity="0.85" 
    />

    <!-- Secondary small budding vitality leaf dot / droplet -->
    <circle cx="360" cy="116" r="16" fill="url(#nt-accent-glow)" />
  </g>
</svg>
