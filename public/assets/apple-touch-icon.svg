<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Forest Green Gradient -->
    <linearGradient id="ati-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043d2e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Vibrant Lime Leaf Gradient -->
    <linearGradient id="ati-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- iOS / Android App Icon Background -->
  <rect width="512" height="512" fill="url(#ati-bg)" />

  <!-- Elegant Ambient Glow behind Emblem -->
  <circle cx="256" cy="256" r="190" fill="#10b981" opacity="0.12" />

  <!-- Left Upright Stem of N (Solid White) -->
  <rect x="136" y="108" width="70" height="296" rx="35" fill="#ffffff" />

  <!-- Right Upright Stem of N (Solid White) -->
  <rect x="306" y="108" width="70" height="296" rx="35" fill="#ffffff" />

  <!-- Diagonal Spanning Leaf of N -->
  <path 
    d="M 172 344 
       C 172 344, 238 250, 318 174 
       C 356 138, 394 112, 416 78 
       C 420 72, 422 80, 408 122 
       C 388 166, 344 216, 290 274 
       C 246 322, 204 376, 182 390 
       C 172 396, 166 386, 166 370 
       Z" 
    fill="url(#ati-leaf)" 
  />

  <!-- High-contrast Leaf Spine -->
  <path 
    d="M 204 314 
       C 252 250, 318 178, 406 82" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="12" 
    stroke-linecap="round" 
    stroke-opacity="0.92" 
  />

  <!-- Subtle Growth Sprout Dot -->
  <circle cx="368" cy="114" r="18" fill="#84cc16" />
</svg>
