<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nt-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063723" />
      <stop offset="100%" stop-color="#0F5132" />
    </linearGradient>
    <linearGradient id="nt-fav-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#E06D53" />
    </linearGradient>
    <linearGradient id="nt-fav-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#nt-fav-bg)" />

  <!-- Subtle track ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="24" />
  <!-- Active progress arc -->
  <circle
    cx="256"
    cy="256"
    r="168"
    fill="none"
    stroke="url(#nt-fav-ring)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-dasharray="840 1060"
    transform="rotate(-115 256 256)"
  />

  <!-- Stylized wellness leaf -->
  <path
    d="M180 318 C176 232, 224 166, 330 144 C336 228, 286 312, 180 318 Z"
    fill="url(#nt-fav-leaf)"
    fill-opacity="0.92"
  />
  <!-- Heartbeat / Vitality pulse carved over leaf -->
  <path
    d="M150 264 L208 264 L232 222 L258 302 L286 244 L306 264 L362 264"
    fill="none"
    stroke="#063723"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M150 264 L208 264 L232 222 L258 302 L286 244 L306 264 L362 264"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Vitality coral accent bead -->
  <circle cx="332" cy="144" r="16" fill="#E06D53" stroke="#FFFFFF" stroke-width="5" />
</svg>
