<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriTrack Clinic &amp; Client App</title>
    <meta name="description" content="NutriTrack Diet Clinic &amp; Client Platform - professional diet management, Kerala meal tracking, mobile nutrition diary, and InBody centre analytics." />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/assets/logo-icon.svg" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.svg" />
    <meta property="og:title" content="NutriTrack Clinic &amp; Client App" />
    <meta property="og:description" content="NutriTrack Diet Clinic &amp; Client Platform - professional diet management, Kerala meal tracking, mobile nutrition diary, and InBody centre analytics." />
    <meta property="og:image" content="/assets/logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nutritrack_clinic_v1_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
